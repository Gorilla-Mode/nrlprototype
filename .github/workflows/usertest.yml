name: Deploy user testing site

on:
  push:
    branches: ["user-test"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usertest-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/user-test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Upload tested build
        uses: actions/upload-artifact@v4
        with:
          name: usertest-site
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: usertest-site
          path: dist

      - name: Checkout testing site repository
        uses: actions/checkout@v4
        with:
          repository: Gorilla-Mode/nrlprototype-usertest
          ref: gh-pages
          ssh-key: ${{ secrets.USERTEST_DEPLOY_KEY }}
          path: deployment

      - name: Publish generated files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -f dist/index.html
          rsync -av --delete --exclude='.git/' dist/ deployment/
          touch deployment/.nojekyll
          cd deployment
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'The testing site already matches this build.'
            exit 0
          fi
          git commit -m "Deploy user-test from ${SOURCE_SHA}"
          git push origin HEAD:gh-pages

      - name: Link testing site
        run: |
          echo 'Testing site: https://gorilla-mode.github.io/nrlprototype-usertest/' >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Pages publishes the site after the generated files are pushed. Check the destination repository Actions tab for deployment status.' >> "$GITHUB_STEP_SUMMARY"
